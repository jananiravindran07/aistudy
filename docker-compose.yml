# Local development database for AI Study Assistant (PostgreSQL 16).
# Start with:  docker compose up -d db
#
# On machines without Docker (or without admin rights), use the portable
# PostgreSQL scripts instead:  scripts/db-init.ps1 / scripts/db-start.ps1

services:
  db:
    image: postgres:16
    container_name: aistudy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aistudy
      POSTGRES_PASSWORD: aistudy
      POSTGRES_DB: aistudy
    ports:
      - "5432:5432"
    volumes:
      - aistudy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aistudy -d aistudy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aistudy_pgdata: